        <div class="container section">
          <h1 class="maintext black text-center">See the World</h1>
          <p class="text-center">Scroll sideways across the map, or pick a continent to jump there.</p>

          <div class="stage" id="stage">
            <div class="world-tunnel">
              <div class="world-map"></div>
            </div>
          </div>

          <div class="text-center continent-buttons" id="buttons"></div>
          <p class="output-text text-center" id="factText"></p>
        </div>

        <footer class="broski text">
          <p>&copy; 2026 Akshay Arora. All rights reserved.</p>
        </footer>

        <script>
          // Each continent: its name, where it sits on the map (0 = left edge, 1 = right edge), and a fact
          var continents = [
            { name: "North America", spot: 0.22, fact: "North America has every type of climate, from Arctic tundra to tropical rainforest." },
            { name: "South America", spot: 0.33, fact: "The Amazon River carries more water than any other river on Earth." },
            { name: "Europe",        spot: 0.53, fact: "Europe has over 40 countries packed into a fairly small area." },
            { name: "Africa",        spot: 0.56, fact: "Africa has 54 countries, more than any other continent." },
            { name: "Asia",          spot: 0.75, fact: "Asia is home to about 60% of all the people in the world." },
            { name: "Australia",     spot: 0.88, fact: "Australia is the only continent that is also a single country." }
          ];

          var stage = document.getElementById("stage");
          var buttonBox = document.getElementById("buttons");

          // The map image is twice as wide as it is tall
          function mapWidth() {
            return stage.clientHeight * 2;
          }

          function goTo(continent) {
            // Use the second copy of the map so we never scroll past the left edge
            var target = mapWidth() + continent.spot * mapWidth() - stage.clientWidth / 2;
            stage.scrollTo({ left: target, behavior: "smooth" });
            document.getElementById("factText").textContent = continent.name + ": " + continent.fact;
          }

          // Make one button for each continent in the list
          for (var i = 0; i < continents.length; i++) {
            var btn = document.createElement("button");
            btn.className = "btn btn-default";
            btn.textContent = continents[i].name;
            btn.addEventListener("click", (function(c) {
              return function() { goTo(c); };
            })(continents[i]));
            buttonBox.appendChild(btn);
          }

          // Start the map on the second copy so you can scroll both ways
          stage.scrollLeft = mapWidth();
        </script>
    </body>
