        <div class="container section">
            <h1 class="maintext black text-center">See the World</h1>
            <p class="text-center">Scroll across the map or pick a continent.</p>

            <div class="stage" id="stage">
                <div class="world-tunnel">
                    <div class="world-map"></div>
                </div>
            </div>
            <p class="text-center scroll-hint"><span class="glyphicon glyphicon-arrow-left"></span> Drag the pink bar to scroll the map <span class="glyphicon glyphicon-arrow-right"></span></p>

            <div class="text-center">
                <button class="btn btn-default" onclick="goTo(0)">North America</button>
                <button class="btn btn-default" onclick="goTo(1)">South America</button>
                <button class="btn btn-default" onclick="goTo(2)">Europe</button>
                <button class="btn btn-default" onclick="goTo(3)">Africa</button>
                <button class="btn btn-default" onclick="goTo(4)">Asia</button>
                <button class="btn btn-default" onclick="goTo(5)">Australia</button>
            </div>
            <p class="output-text text-center" id="factText"></p>
        </div>

        <footer class="broski text">
            <p>Created by Akshay Arora &copy; 2026</p>

                <a class="footer-link" href="https://www.livermoreschools.org/granadahigh" target="_blank"><span class="glyphicon glyphicon-education"></span> Granada High School</a>

                <a class="footer-link" href="mailto:YOUR_EMAIL_HERE"><span class="glyphicon glyphicon-envelope"></span> Email me</a>
            </p>
        </footer>

        <script>
            // where each continent is on the map (0 = left side, 1 = right side)
            var spots = [0.22, 0.33, 0.53, 0.56, 0.75, 0.88];

            var facts = [
                "North America: it has every climate, from frozen tundra to rainforest.",
                "South America: the Amazon River carries more water than any other river.",
                "Europe: it has over 40 countries in a pretty small area.",
                "Africa: it has 54 countries, more than any other continent.",
                "Asia: about 60% of all people in the world live here.",
                "Australia: it's the only continent that is also one country."
            ];

            var stage = document.getElementById("stage");

            function goTo(number) {
                // the map picture is twice as wide as it is tall
                var mapWidth = stage.clientHeight * 2;
                var target = mapWidth + spots[number] * mapWidth - stage.clientWidth / 2;
                stage.scrollTo({ left: target, behavior: "smooth" });
                document.getElementById("factText").innerHTML = facts[number];
            }

            // start on the second copy of the map so you can scroll both ways
            stage.scrollLeft = stage.clientHeight * 2;
        </script>
    </body>
